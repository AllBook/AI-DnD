# Render blueprint for AI-DnD Online (the multiplayer server in ./online).
# https://render.com/deploy picks this file up from the repository root.
services:
  - type: web
    name: ai-dnd-online
    runtime: node
    plan: free
    rootDir: online
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      # The Dungeon Master's brain. Set one of these two.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # Voices for the Dungeon Master and NPCs (optional).
      - key: ELEVENLABS_API_KEY
        sync: false
      # Free cloud saves so campaigns survive restarts (optional, see online/README.md).
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
